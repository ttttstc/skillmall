# =============================================================================
# 第 3 步：部署 scanner（技能安全扫描器）
# =============================================================================
# 包含：Service(skillmall-scanner:8000) + Deployment(skillmall-scanner)
# 依赖：无。scanner 是无状态服务，不连 DB / Redis / OBS。
#
# 用法：替换 2 处 REPLACE-ME → kubectl -n cannbot-beta apply -f 04-scanner.yaml
#
# 部署完还要改 server 的开关，否则 server 不会调用它：
#   SKILLHUB_SECURITY_SCANNER_ENABLED = "true"
#   SKILLHUB_SECURITY_SCANNER_URL     = "http://skillmall-scanner:8000"
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: skillmall-scanner
  namespace: cannbot-beta
  labels:
    app.kubernetes.io/name: skillmall
    app.kubernetes.io/component: scanner
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: skillmall
    app.kubernetes.io/component: scanner
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skillmall-scanner
  namespace: cannbot-beta
  labels:
    app.kubernetes.io/name: skillmall
    app.kubernetes.io/component: scanner
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: skillmall
      app.kubernetes.io/component: scanner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: skillmall
        app.kubernetes.io/component: scanner
    spec:
      imagePullSecrets:
        - name: default-secret        # CCE 自动创建，用于拉 SWR 镜像
      containers:
        - name: scanner
          image: "swr.cn-north-4.myhuaweicloud.com/REPLACE-ME-ORG/skillmall-scanner:REPLACE-ME-TAG"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            # 上传上限，必须与网关/Ingress 的请求体上限对齐
            # 110100480 ≈ 105MiB；ELB 默认 1MB 会 413，需在 ELB 侧放开
            - name: SKILLHUB_SCANNER_MAX_UPLOAD_SIZE_BYTES
              value: "110100480"

            # ---------- 可选：LLM 辅助审核 ----------
            # 三项都不配则跳过 LLM 环节，只用规则扫描。
            # - name: SKILL_SCANNER_LLM_API_KEY
            #   value: "REPLACE-ME"
            # - name: SKILL_SCANNER_LLM_BASE_URL
            #   value: "https://REPLACE-ME/v1"
            # - name: SKILL_SCANNER_LLM_MODEL
            #   value: "REPLACE-ME"
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits:   { cpu: "2000m", memory: "4Gi" }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 15
# =============================================================================
# 验证：
#   kubectl -n cannbot-beta get pods -l app.kubernetes.io/component=scanner
#   kubectl -n cannbot-beta exec -it deploy/skillmall-scanner -- \
#     python -c "import urllib.request;print(urllib.request.urlopen('http://127.0.0.1:8000/health').read().decode())"
#
# 再改 server 开关后，发布技能时日志里应出现扫描相关记录。
#
# ⚠️ 超时提醒：CCE ELB Ingress 的后端超时上限 300s，而扫描任务可能更久。
#    如果发布技能时出现 504，说明命中了这个上限，需要改走 nginx-ingress。
# =============================================================================
