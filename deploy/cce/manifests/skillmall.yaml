# =============================================================================
# SkillMall on CCE —— 完整部署清单（不用 Helm 时用这份）
# =============================================================================
# 约定：ConfigMap / Secret 的**键名就是环境变量名**，Deployment 用 envFrom 导入。
#       控制台里只需「配置项导入 / 密钥导入」一次，不用逐个映射变量名。
#
# 部署顺序建议（一个一个来）：
#   1. 只用 01-server-only.yaml 起 server，验证 RDS/DCS/OBS
#   2. 再 apply 本文件（会创建 web / scanner / Ingress）
#
# 用法：替换所有 REPLACE-ME → kubectl -n skillhub apply -f skillmall.yaml
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: skillhub-config
  namespace: skillhub
data:
  # 运行形态
  SPRING_PROFILES_ACTIVE: "docker"
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70.0 -XX:+ExitOnOutOfMemoryError"
  SKILLHUB_SUITE_REVIEW_WRITES_ENABLED: "true"

  # RDS for PostgreSQL
  DATASOURCE_HOST: "REPLACE-ME-rds.myhuaweicloud.com"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://REPLACE-ME-rds.myhuaweicloud.com:5432/skillhub?sslmode=require"
  SPRING_DATASOURCE_USERNAME: "skillhub"

  # DCS for Redis
  SPRING_DATA_REDIS_HOST: "REPLACE-ME-dcs.myhuaweicloud.com"
  SPRING_DATA_REDIS_PORT: "6379"

  # OBS
  STORAGE_BASE_PATH: "/var/lib/skillhub/storage"
  SKILLHUB_STORAGE_PROVIDER: "obs"
  SKILLHUB_STORAGE_OBS_BUCKET: "REPLACE-ME-bucket"
  SKILLHUB_STORAGE_OBS_ENDPOINT: "https://obs.REPLACE-ME.myhuaweicloud.com"
  SKILLHUB_STORAGE_OBS_PUBLIC_ENDPOINT: ""
  SKILLHUB_STORAGE_OBS_PRESIGN_EXPIRY: "PT10M"
  SKILLHUB_STORAGE_OBS_CREDENTIAL_MODE: "auto"
  SKILLHUB_STORAGE_OBS_METADATA_URL: "http://169.254.169.254/openstack/latest/securitykey"
  SKILLHUB_STORAGE_OBS_METADATA_TIMEOUT: "PT5S"
  SKILLHUB_STORAGE_OBS_CREDENTIAL_TTL: "PT50M"

  # 扫描器
  SKILLHUB_SECURITY_SCANNER_ENABLED: "true"
  SKILLHUB_SECURITY_SCANNER_URL: "http://skillhub-scanner:8000"
  SKILLHUB_SECURITY_SCANNER_MODE: "upload"

  # 对外地址 / 会话
  SKILLHUB_PUBLIC_BASE_URL: "https://REPLACE-ME.example.com"
  DEVICE_AUTH_VERIFICATION_URI: "https://REPLACE-ME.example.com/device"
  SESSION_COOKIE_SECURE: "true"

  # 认证：server 用 SKILLHUB_AUTH_*，web 用 SKILLHUB_WEB_AUTH_*
  SKILLHUB_AUTH_DIRECT_ENABLED: "true"
  SKILLHUB_AUTH_INITIAL_PASSWORD_LOGIN_ENABLED: "true"
  SKILLHUB_AUTH_INITIAL_SELF_REGISTRATION_ENABLED: "true"
  SKILLHUB_WEB_AUTH_DIRECT_ENABLED: "true"
  SKILLHUB_WEB_AUTH_DIRECT_PROVIDER: "local"

  # 前端子路径（根路径部署留空）
  SKILLHUB_WEB_BASE_PATH: ""
  SKILLHUB_WEB_API_BASE_URL: ""

  # 内置技能
  SKILLHUB_BUILTIN_SKILLS_ENABLED: "true"

  # 初始管理员
  BOOTSTRAP_ADMIN_ENABLED: "true"
  BOOTSTRAP_ADMIN_USER_ID: "docker-admin"
  BOOTSTRAP_ADMIN_USERNAME: "admin"
  BOOTSTRAP_ADMIN_DISPLAY_NAME: "Platform Admin"
  BOOTSTRAP_ADMIN_EMAIL: "admin@REPLACE-ME.example.com"
---
# web 专用（与主 ConfigMap 分开，改统计只滚动 web）。键名同样即变量名。
apiVersion: v1
kind: ConfigMap
metadata:
  name: skillhub-web-analytics
  namespace: skillhub
data:
  SKILLHUB_WEB_ANALYTICS_CONFIG: ""
  SKILLHUB_WEB_ANALYTICS_UPSTREAM: ""
---
apiVersion: v1
kind: Service
metadata:
  name: skillhub-server
  namespace: skillhub
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: skillhub, app.kubernetes.io/component: server }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: v1
kind: Service
metadata:
  name: skillhub-web
  namespace: skillhub
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: skillhub, app.kubernetes.io/component: web }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: v1
kind: Service
metadata:
  name: skillhub-scanner
  namespace: skillhub
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: skillhub, app.kubernetes.io/component: scanner }
  ports: [{ name: http, port: 8000, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skillhub-server
  namespace: skillhub
  labels: { app.kubernetes.io/name: skillhub, app.kubernetes.io/component: server }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: skillhub, app.kubernetes.io/component: server }
  template:
    metadata:
      labels: { app.kubernetes.io/name: skillhub, app.kubernetes.io/component: server }
    spec:
      imagePullSecrets: [{ name: default-secret }]
      containers:
        - name: server
          image: "swr.REPLACE-ME.myhuaweicloud.com/REPLACE-ME-ORG/skillmall-server:REPLACE-ME-TAG"
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: skillhub-config }
            - secretRef: { name: skillhub-app-secrets }
          resources:
            requests: { cpu: "1000m", memory: "2Gi" }
            limits:   { cpu: "2000m", memory: "4Gi" }
          startupProbe:
            httpGet: { path: /actuator/health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /actuator/health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skillhub-web
  namespace: skillhub
  labels: { app.kubernetes.io/name: skillhub, app.kubernetes.io/component: web }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: skillhub, app.kubernetes.io/component: web }
  template:
    metadata:
      labels: { app.kubernetes.io/name: skillhub, app.kubernetes.io/component: web }
    spec:
      imagePullSecrets: [{ name: default-secret }]
      containers:
        - name: web
          image: "swr.REPLACE-ME.myhuaweicloud.com/REPLACE-ME-ORG/skillmall-web:REPLACE-ME-TAG"
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 80 }]
          env:
            # 唯一必须单独写的：后端上游地址（用 FQDN，不依赖 search 后缀）
            - name: SKILLHUB_API_UPSTREAM
              value: "http://skillhub-server.skillhub.svc.cluster.local:8080"
          envFrom:
            - configMapRef: { name: skillhub-config }
            - configMapRef: { name: skillhub-web-analytics }
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "256Mi" }
          readinessProbe:
            httpGet: { path: /nginx-health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /nginx-health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skillhub-scanner
  namespace: skillhub
  labels: { app.kubernetes.io/name: skillhub, app.kubernetes.io/component: scanner }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: skillhub, app.kubernetes.io/component: scanner }
  template:
    metadata:
      labels: { app.kubernetes.io/name: skillhub, app.kubernetes.io/component: scanner }
    spec:
      imagePullSecrets: [{ name: default-secret }]
      containers:
        - name: scanner
          image: "swr.REPLACE-ME.myhuaweicloud.com/REPLACE-ME-ORG/skillmall-scanner:REPLACE-ME-TAG"
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8000 }]
          # 扫描器无状态，不需要 DB/Redis/OBS；只接 LLM 相关（可选）
          env:
            - name: SKILLHUB_SCANNER_MAX_UPLOAD_SIZE_BYTES
              value: "110100480"     # 约 105MiB，需与 Ingress proxy-body-size 对齐
            - name: SKILL_SCANNER_LLM_API_KEY
              valueFrom:
                secretKeyRef: { name: skillhub-app-secrets, key: SKILL_SCANNER_LLM_API_KEY, optional: true }
            - name: SKILL_SCANNER_LLM_BASE_URL
              valueFrom:
                secretKeyRef: { name: skillhub-app-secrets, key: SKILL_SCANNER_LLM_BASE_URL, optional: true }
            - name: SKILL_SCANNER_LLM_MODEL
              valueFrom:
                secretKeyRef: { name: skillhub-app-secrets, key: SKILL_SCANNER_LLM_MODEL, optional: true }
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits:   { cpu: "2000m", memory: "4Gi" }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 15
---
# 必须 nginx：CCE 不写 ingressClassName 时默认 cce(ELB)，而 ELB 的 member_timeout 上限 300s，
# 扫描最长约 900s 必然 504。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: skillhub
  namespace: skillhub
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "110m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "900"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "900"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [REPLACE-ME.example.com]
      secretName: skillhub-tls
  rules:
    - host: REPLACE-ME.example.com
      http:
        paths:
          - { path: /api,           pathType: Prefix, backend: { service: { name: skillhub-server, port: { number: 8080 } } } }
          - { path: /oauth2,        pathType: Prefix, backend: { service: { name: skillhub-server, port: { number: 8080 } } } }
          - { path: /login/oauth2,  pathType: Prefix, backend: { service: { name: skillhub-server, port: { number: 8080 } } } }
          - { path: /.well-known,   pathType: Prefix, backend: { service: { name: skillhub-server, port: { number: 8080 } } } }
          - { path: /,              pathType: Prefix, backend: { service: { name: skillhub-web,    port: { number: 80 } } } }
