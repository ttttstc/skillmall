# =============================================================================
# 单入口：所有流量走 /skillmall（短期方案）
# =============================================================================
#   https://beta.hicann.cn/skillmall/*  ->  skillmall-web:80
#
# web 的 Nginx 负责：
#   - 提供静态页面
#   - 剥掉 /skillmall 前缀，把 /skillmall/api/... 反代到 skillmall-server:8080
#
# 因此**不需要**为 /api、/oauth2、/.well-known 单独加规则。
# 反例：如果额外把 /api 指给 server，会绕过 web 的前缀剥离，
#       server 只认 /api 不认 /skillmall/api -> 全站 404。
#
# 已知上限（短期接受）：
#   - web Nginx client_max_body_size = 100M 且写死在镜像里（nginx.conf.template:10），
#     所以**经 web 发布的技能包必须 < 100MB（含 multipart 封装开销）**，
#     实际建议打包 < 98MB。
#   - web 反代未设 proxy_read_timeout，走 Nginx 默认 60s。发布若同步等待扫描
#     且超过 60s，会在此处 504（早于 ELB 的 300s 上限）。
#   - 下载不受影响：下载端点返回 302 跳到 OBS 预签名地址，字节不经过这里。
#
# 后续若要支持"正好 100MB 的包"或"扫描 >60s"，改为页面/API 分离入口：
#   /skillmall -> web:80 ；/api、/oauth2、/login/oauth2、/.well-known -> server:8080
#   并把 web 的 SKILLHUB_WEB_API_BASE_URL 改成绝对地址 https://beta.hicann.cn
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: skillmall
  namespace: cannbot-beta
  annotations:
    # 独享型 ELB；共享型改写 union
    kubernetes.io/elb.class: performance
    # 绑定已有 ELB 时填 ID，不填则自动创建
    # kubernetes.io/elb.id: REPLACE-ME-elb-id
    kubernetes.io/elb.keepalive_timeout: "300"
spec:
  ingressClassName: cce
  tls:
    - hosts:
        - beta.hicann.cn
      secretName: skillmall-tls
  rules:
    - host: beta.hicann.cn
      http:
        paths:
          # 只这一条。web 自己剥前缀，此处必须原样转发，不能配 rewrite。
          - path: /skillmall
            pathType: Prefix
            backend:
              service:
                name: skillmall-web
                port:
                  number: 80
# =============================================================================
# ELB 侧（控制台「后端服务器组」，不在 Ingress 注解里）：
#   健康检查路径 /skillmall/nginx-health    期望 200
#   后端超时 member_timeout = 300s（ELB 上限）
#   请求体上限（若有该参数）>= 110MB
# =============================================================================
# 验证：
#   curl -I  https://beta.hicann.cn/skillmall/
#   curl -s  https://beta.hicann.cn/skillmall/registry/skill.md | head -3
#   curl -s  https://beta.hicann.cn/skillmall/.well-known/skillhub
#   curl -sI https://beta.hicann.cn/skillmall/api/v1/skills | head -3
#
# 下载验证（看 Location 是否指向 OBS）：
#   curl -sI "https://beta.hicann.cn/skillmall/api/v1/skills/<ns>/<slug>/versions/<ver>/download" \
#     | grep -i location
# =============================================================================
