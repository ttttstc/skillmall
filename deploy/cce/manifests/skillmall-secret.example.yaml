# =============================================================================
# SkillMall on CCE —— 应用 Secret（示例，禁止提交真实值）
# =============================================================================
# 键名就是环境变量名（Deployment 用 envFrom 导入），不要改成小写或短横线形式。
#
# 用法：
#   cp deploy/cce/manifests/skillmall-secret.example.yaml /tmp/skillmall-secret.yaml
#   # 编辑 /tmp/skillmall-secret.yaml，替换所有 REPLACE-ME
#   kubectl -n skillhub apply -f /tmp/skillmall-secret.yaml
#
# 也可用命令行创建（推荐，明文不进仓库）：
#   kubectl -n skillhub create secret generic skillhub-app-secrets \
#     --from-literal=SPRING_DATASOURCE_PASSWORD='...' \
#     --from-literal=SPRING_DATA_REDIS_PASSWORD='...' \
#     --from-literal=BOOTSTRAP_ADMIN_PASSWORD='...' \
#     --from-literal=SKILLHUB_DOWNLOAD_ANON_COOKIE_SECRET="$(openssl rand -base64 32)"
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: skillhub-app-secrets
  namespace: skillhub
type: Opaque
stringData:
  # ---- 必填 ----
  SPRING_DATASOURCE_PASSWORD: "REPLACE-ME-db-password"                     # RDS 应用账号密码
  SPRING_DATA_REDIS_PASSWORD: "REPLACE-ME-redis-password"                  # DCS 实例密码
  BOOTSTRAP_ADMIN_PASSWORD: "REPLACE-ME-admin-password"                    # 首次登录管理员密码
  SKILLHUB_DOWNLOAD_ANON_COOKIE_SECRET: "REPLACE-ME-at-least-32-chars"     # ≥32 字符随机值，应用会校验

  # ---- 仅 SKILLHUB_STORAGE_OBS_CREDENTIAL_MODE=static 时需要 ----
  # SKILLHUB_STORAGE_OBS_ACCESS_KEY: "REPLACE-ME-ak"
  # SKILLHUB_STORAGE_OBS_SECRET_KEY: "REPLACE-ME-sk"

  # ---- 可选：扫描器 LLM 辅助审核 ----
  # SKILL_SCANNER_LLM_API_KEY: "REPLACE-ME"
  # SKILL_SCANNER_LLM_BASE_URL: "https://REPLACE-ME/v1"
  # SKILL_SCANNER_LLM_MODEL: "REPLACE-ME"

  # ---- 可选：OAuth 登录 ----
  # OAUTH2_GITHUB_CLIENT_ID: "REPLACE-ME"
  # OAUTH2_GITHUB_CLIENT_SECRET: "REPLACE-ME"
  # OAUTH2_FEISHU_CLIENT_ID: "REPLACE-ME"
  # OAUTH2_FEISHU_CLIENT_SECRET: "REPLACE-ME"
  # OAUTH2_DINGTALK_CLIENT_ID: "REPLACE-ME"
  # OAUTH2_DINGTALK_CLIENT_SECRET: "REPLACE-ME"
