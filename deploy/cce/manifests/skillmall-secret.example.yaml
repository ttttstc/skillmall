# =============================================================================
# SkillMall on CCE —— 应用 Secret（示例，禁止提交真实值）
# =============================================================================
# 用法：
#   cp deploy/cce/manifests/skillmall-secret.example.yaml /tmp/skillmall-secret.yaml
#   # 编辑 /tmp/skillmall-secret.yaml，替换所有 REPLACE-ME
#   kubectl -n skillhub apply -f /tmp/skillmall-secret.yaml
#
# 只把替换后的文件放在 /tmp 或密码库里；本仓库里这个 example 只保留占位值。
# 生成随机值（Linux/macOS）：
#   openssl rand -base64 32        # 匿名下载签名密钥
#   openssl rand -base64 24        # 管理员密码
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: skillhub-app-secrets
  namespace: skillhub
type: Opaque
stringData:
  # ---- 必填 ----
  # RDS for PostgreSQL 应用账号密码（对应 ConfigMap 里 datasource-url 的账号）
  spring-datasource-password: "REPLACE-ME-db-password"

  # DCS for Redis 访问密码（Proxy/主备版即实例密码）
  redis-password: "REPLACE-ME-redis-password"

  # 首次启动创建的管理员密码（登录后请立即修改）
  bootstrap-admin-password: "REPLACE-ME-admin-password"

  # 匿名下载签名的 Cookie 密钥，至少 32 字符随机值；不要用默认占位值，应用会拒绝启动
  skillhub-download-anon-cookie-secret: "REPLACE-ME-at-least-32-chars-random-value"

  # ---- 仅在 obs-credential-mode=static 时需要 ----
  # 走 CCE 元数据临时凭证（auto/metadata）时保持注释掉或留空
  # skillhub-storage-obs-access-key: "REPLACE-ME-ak"
  # skillhub-storage-obs-secret-key: "REPLACE-ME-sk"

  # ---- 可选：扫描器的 LLM 辅助审核 ----
  # skill-scanner-llm-api-key: "REPLACE-ME"
  # skill-scanner-llm-base-url: "https://REPLACE-ME/v1"
  # skill-scanner-llm-model: "REPLACE-ME"

  # ---- 可选：OAuth 登录 ----
  # oauth2-github-client-id: "REPLACE-ME"
  # oauth2-github-client-secret: "REPLACE-ME"
  # oauth2-feishu-client-id: "REPLACE-ME"
  # oauth2-feishu-client-secret: "REPLACE-ME"
  # oauth2-dingtalk-client-id: "REPLACE-ME"
  # oauth2-dingtalk-client-secret: "REPLACE-ME"
