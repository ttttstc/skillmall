# =============================================================================
# 第 1 步（无权限版）：只部署 server，全部配置写进环境变量
# =============================================================================
# 适用场景：当前账号**没有创建 Secret 的权限**，且只需要先把测试环境跑通。
#
# ⚠️ 风险：密码/密钥以明文出现在 Deployment 的 spec 里，任何能查看工作负载的人
#    都能读到；也会留在控制台的变更记录中。正式环境请改回 Secret 引用
#    （见 01-server-only.yaml，用 envFrom 导入 skillhub-config + skillhub-app-secrets）。
#
# 本文件只包含 2 个对象：Service + Deployment。不依赖 ConfigMap，也不依赖 Secret。
# 因此只需要「工作负载」权限即可部署。
#
# 用法：替换所有 REPLACE-ME → kubectl -n skillhub apply -f 01b-server-env-only.yaml
#      或把本文件内容整段粘贴到 CCE 控制台的「YAML 创建」入口。
#
# 第 1 步的让步：
#   - SKILLHUB_SECURITY_SCANNER_ENABLED=false（不依赖 scanner）
#   - 无 initContainer（不依赖 SWR 里的 busybox）
#   - replicas=1
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: skillhub-server
  namespace: skillhub
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: skillhub
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skillhub-server
  namespace: skillhub
  labels:
    app.kubernetes.io/name: skillhub
    app.kubernetes.io/component: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: skillhub
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: skillhub
        app.kubernetes.io/component: server
    spec:
      imagePullSecrets:
        - name: default-secret      # CCE 自动创建，用于拉取 SWR 镜像
      containers:
        - name: server
          image: "swr.REPLACE-ME.myhuaweicloud.com/REPLACE-ME-ORG/skillmall-server:REPLACE-ME-TAG"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            # ---------- 运行形态 ----------
            - name: SPRING_PROFILES_ACTIVE
              value: "docker"
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=70.0 -XX:+ExitOnOutOfMemoryError"
            - name: SKILLHUB_SUITE_REVIEW_WRITES_ENABLED
              value: "true"

            # ---------- RDS for PostgreSQL ----------
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://REPLACE-ME-rds.myhuaweicloud.com:5432/skillhub?sslmode=require"
            - name: SPRING_DATASOURCE_USERNAME
              value: "skillhub"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "REPLACE-ME-db-password"          # ⚠️ 明文，仅测试环境

            # ---------- DCS for Redis ----------
            - name: SPRING_DATA_REDIS_HOST
              value: "REPLACE-ME-dcs.myhuaweicloud.com"
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
            - name: SPRING_DATA_REDIS_PASSWORD
              value: "REPLACE-ME-redis-password"       # ⚠️ 明文；DCS 免密时填 ""

            # ---------- 存储：华为云 OBS ----------
            - name: STORAGE_BASE_PATH
              value: "/var/lib/skillhub/storage"
            - name: SKILLHUB_STORAGE_PROVIDER
              value: "obs"
            - name: SKILLHUB_STORAGE_OBS_BUCKET
              value: "REPLACE-ME-bucket"
            - name: SKILLHUB_STORAGE_OBS_ENDPOINT
              value: "https://obs.REPLACE-ME.myhuaweicloud.com"
            - name: SKILLHUB_STORAGE_OBS_PUBLIC_ENDPOINT
              value: ""                                 # 空＝与 endpoint 相同
            - name: SKILLHUB_STORAGE_OBS_PRESIGN_EXPIRY
              value: "PT10M"
            # auto：优先用下面的静态 AK/SK；不填则退化到元数据临时凭证
            - name: SKILLHUB_STORAGE_OBS_CREDENTIAL_MODE
              value: "auto"
            - name: SKILLHUB_STORAGE_OBS_METADATA_URL
              value: "http://169.254.169.254/openstack/latest/securitykey"
            - name: SKILLHUB_STORAGE_OBS_METADATA_TIMEOUT
              value: "PT5S"
            - name: SKILLHUB_STORAGE_OBS_CREDENTIAL_TTL
              value: "PT50M"
            # 若没有 IAM 委托，就把下面两个填上真实 AK/SK（⚠️ 明文，仅测试）
            - name: SKILLHUB_STORAGE_OBS_ACCESS_KEY
              value: ""
            - name: SKILLHUB_STORAGE_OBS_SECRET_KEY
              value: ""

            # ---------- 扫描器：第 1 步先关 ----------
            - name: SKILLHUB_SECURITY_SCANNER_ENABLED
              value: "false"
            - name: SKILLHUB_SECURITY_SCANNER_URL
              value: "http://skillhub-scanner:8000"
            - name: SKILLHUB_SECURITY_SCANNER_MODE
              value: "upload"

            # ---------- 对外地址 / 会话 ----------
            - name: SKILLHUB_PUBLIC_BASE_URL
              value: "https://REPLACE-ME.example.com"
            - name: DEVICE_AUTH_VERIFICATION_URI
              value: "https://REPLACE-ME.example.com/device"
            - name: SESSION_COOKIE_SECURE
              value: "true"

            # ---------- 认证 ----------
            - name: SKILLHUB_AUTH_DIRECT_ENABLED
              value: "true"
            - name: SKILLHUB_AUTH_INITIAL_PASSWORD_LOGIN_ENABLED
              value: "true"
            - name: SKILLHUB_AUTH_INITIAL_SELF_REGISTRATION_ENABLED
              value: "true"

            # ---------- 前端子路径（根路径部署留空） ----------
            - name: WEB_BASE_PATH
              value: ""
            - name: WEB_API_BASE_URL
              value: ""

            # ---------- 内置技能 ----------
            - name: SKILLHUB_BUILTIN_SKILLS_ENABLED
              value: "true"

            # ---------- 初始管理员 ----------
            - name: BOOTSTRAP_ADMIN_ENABLED
              value: "true"
            - name: BOOTSTRAP_ADMIN_USER_ID
              value: "docker-admin"
            - name: BOOTSTRAP_ADMIN_USERNAME
              value: "admin"
            - name: BOOTSTRAP_ADMIN_DISPLAY_NAME
              value: "Platform Admin"
            - name: BOOTSTRAP_ADMIN_EMAIL
              value: "admin@REPLACE-ME.example.com"
            - name: BOOTSTRAP_ADMIN_PASSWORD
              value: "REPLACE-ME-admin-password"       # ⚠️ 明文，仅测试环境

            # ---------- 匿名下载签名密钥（必填，≥32 字符）----------
            - name: SKILLHUB_DOWNLOAD_ANON_COOKIE_SECRET
              value: "REPLACE-ME-at-least-32-chars-random-value"   # ⚠️ 明文，仅测试环境
          resources:
            requests: { cpu: "1000m", memory: "2Gi" }
            limits:   { cpu: "2000m", memory: "4Gi" }
          startupProbe:
            httpGet: { path: /actuator/health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 30        # 首次启动要跑 Flyway 迁移，给足 5 分钟
          readinessProbe:
            httpGet: { path: /actuator/health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 15
