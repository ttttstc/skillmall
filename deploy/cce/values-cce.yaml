# =============================================================================
# 示例/合并片段，需替换占位值；禁止提交真实凭证
# =============================================================================
# SkillHub on Huawei Cloud CCE —— 主路径 values（叠加在 charts/skillhub/values.yaml 之上）
#
#   helm -n skillhub upgrade -i skillhub ./charts/skillhub \
#     -f deploy/cce/values-cce.yaml
#
# 路径组合：SWR 镜像 + OBS 对象存储（原生 obs provider）+ 托管 RDS for PostgreSQL +
#          托管 DCS for Redis + CCE nginx-ingress。
# 需要 chart 内置 Bitnami PG/Redis 时，再叠加 deploy/cce/values-cce-incluster-db.yaml。
#
# 渲染前必须先把子 chart 取到本地（仓库未 vendor）：
#   helm dependency build ./charts/skillhub
#
# -----------------------------------------------------------------------------
# 占位符约定（替换项全在这里说明）
# -----------------------------------------------------------------------------
# 1) 尖括号 <...>：用于不受 chart schema / validate.yaml 正则约束的自由文本字段。
#    <REGION>    CCE/OBS/RDS/DCS 所在区域，例如 cn-north-4
#    <ORG>       SWR 组织名，例如 skillhub
#    <TAG>       SWR 镜像 tag，例如 v0.2.14（与 server/web/scanner 镜像保持一致）
#    <OBS_BUCKET> 已存在的 OBS 桶名（chart 不建桶；桶必须预创建）
# 2) REPLACE-ME：用于**必须是合法主机名/URL**的字段（ingress host、publicBaseUrl、
#    OBS endpoint、RDS/DCS 主机名）。这些字段被 values.schema.json 的 pattern 与
#    templates/validate.yaml 的绝对 URL 校验约束，写尖括号会直接 fail 渲染，
#    因此统一用 REPLACE-ME 占位；它承载的就是同一个 <REGION> 或真实域名。
# 3) 所有密码/密钥一律不写在本文件，放在部署前预创建的 Secret
#    `skillhub-app-secrets`（见 deploy/cce/secrets-cce.example.yaml）。
# -----------------------------------------------------------------------------

# --- 镜像（SWR）--------------------------------------------------------------
# 镜像全名：swr.<REGION>.myhuaweicloud.com/<ORG>/skillhub-{server,web,scanner}:<TAG>
images:
  registry: "swr.<REGION>.myhuaweicloud.com/<ORG>"
  tag: "<TAG>"
  pullPolicy: IfNotPresent

# --- 公开访问地址 -------------------------------------------------------------
# 浏览器 / CLI / OAuth 回调共用；必须与 ingress.hosts[].host 一致，且不带末尾斜杠，
# 也不能带 ? 或 #（validate.yaml 会校验）。
publicBaseUrl: "https://skillhub.REPLACE-ME.example.com"
# 不填时 chart 自动推导为 <publicBaseUrl>/device，保留子路径语义。
# deviceAuthVerificationUri: "https://skillhub.REPLACE-ME.example.com/device"

springProfilesActive: docker

# --- Secret ------------------------------------------------------------------
# 使用预创建 Secret：chart 不再创建应用 Secret，所有键必须预先存在且齐全。
existingSecret: skillhub-app-secrets
secrets:
  # 有 existingSecret 时 validate.yaml 的自动生成检查被跳过；
  # 仍显式关闭，避免误用随机 Secret。
  allowAutoGenerated: false

# --- 初始管理员 ---------------------------------------------------------------
bootstrapAdmin:
  enabled: true
  userId: docker-admin
  username: admin
  displayName: "平台管理员"
  email: "admin@REPLACE-ME.example.com"
  # 密码不写这里：由 Secret 键 bootstrap-admin-password 提供。
  password: ""

# --- Session -----------------------------------------------------------------
# TLS 终止后必须为 true，否则浏览器丢弃 Secure Cookie。
session:
  cookieSecure: true

# --- Ingress（CCE nginx-ingress）---------------------------------------------
ingress:
  enabled: true
  # CCE 关键点：不写 ingressClassName 时默认值是 `cce`（ELB Ingress），会走错控制器。
  # 本部署必须落到 CCE NGINX Ingress 插件（addon）上，所以显式写 nginx。
  # 也不要用 ELB Ingress：它的 kubernetes.io/elb.member_timeout 上限 300s，
  # 而技能扫描最长约 900s，必然 504。
  className: nginx
  hosts:
    - host: skillhub.REPLACE-ME.example.com
      paths:
        - path: /
          pathType: Prefix
  # 注解值一律按字符串写（CCE 要求）。标注 ⚠ 的是社区原生注解：CCE 声明支持但
  # 未逐一文档化，上线前必须在目标集群实测（尤其读写超时与 buffering）。
  annotations:
    # 上传上限 110100480 字节 ≈ 105MiB，与 scanner.maxUploadSizeBytes 对齐；超出即 413
    nginx.ingress.kubernetes.io/proxy-body-size: "110m"
    # ⚠ 扫描最长约 900s：读写超时必须同步放开，否则 504
    nginx.ingress.kubernetes.io/proxy-read-timeout: "900"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "900"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "120"
    # ⚠ 关闭响应/请求缓冲：SSE 与长连接、大文件直传不经过 ingress 临时文件
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    # 有 TLS 时默认已开，显式写出便于审计
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  # 使用预创建的 TLS Secret（CCE 场景通常由 ELB 证书或 cert-manager 之外的
  # 途径签发）。非空 tls 会让 chart 自动把 Session Cookie 置为 Secure。
  tls:
    - hosts:
        - skillhub.REPLACE-ME.example.com
      secretName: skillhub-tls
  # CCE 一般不自带 cert-manager，保持 false；如集群已装可改 true
  #（certManager.enabled=true 时必须有至少一个 tls 条目）。
  certManager:
    enabled: false
    issuerName: letsencrypt-prod
    issuerKind: ClusterIssuer

# --- 存储：OBS ----------------------------------------------------------------
# 技能包等对象存 OBS，走后端原生 obs 适配器（非 S3 兼容层）。
# 生效后：不创建 PVC、Deployment 使用 RollingUpdate、configmap 置
# skillhub-storage-provider=obs。s3 与 obs 互斥，这里显式关闭 s3。
s3:
  enabled: false
  bucket: "skillhub-storage"
  endpoint: ""
  publicEndpoint: ""
  region: "<REGION>"
  forcePathStyle: true
  disableChunkedEncoding: false
  autoCreateBucket: false
  presignExpiry: PT10M
  accessKey: ""
  secretKey: ""

obs:
  enabled: true
  # 桶必须预先创建（本路径不自动建桶），且与 CCE 同区域以内网访问。
  bucket: "<OBS_BUCKET>"
  # OBS 服务端点（内网/公网均可，建议内网）。REPLACE-ME = <REGION>。
  endpoint: "https://obs.REPLACE-ME.myhuaweicloud.com"
  # 留空表示与 endpoint 相同；只有走自定义域名/CDN 时才另填。
  publicEndpoint: ""
  # 预签名下载链接有效期（ISO-8601 duration）。
  presignExpiry: PT10M
  # auto   = CCE 委托/元数据服务临时凭证（推荐，无静态 AK/SK）
  # static = 使用 accessKey/secretKey（优先由 Secret 注入）
  # metadata = 显式走元数据服务
  credentialMode: auto
  # credentialMode=static 时才需要；CCE 委托模式下保持为空。
  # 真实值放 Secret：skillhub-storage-obs-access-key / skillhub-storage-obs-secret-key
  accessKey: ""
  secretKey: ""
  # CCE 元数据服务（IAM 委托临时凭证）。默认值即为此 URL，显式写出便于排障。
  # 若集群的元数据服务被安全组/NetworkPolicy 阻断，这一跳会失败——见风险说明。
  metadataUrl: "http://169.254.169.254/openstack/latest/securitykey"
  metadataTimeout: "PT5S"
  # 临时凭证刷新周期，必须小于 IAM 委托凭证有效期（通常 1 小时），默认 50 分钟。
  credentialTtl: "PT50M"

# --- 数据库：托管 RDS for PostgreSQL -----------------------------------------
postgresql:
  enabled: false

externalDatabase:
  # RDS for PostgreSQL 16 实例的内网地址（控制台“连接管理”里的内网 IP 或域名）。
  # REPLACE-ME = <REGION>；RDS 端口固定 5432。
  host: "skillhub-pg.REPLACE-ME.rds.myhuaweicloud.com"
  port: 5432
  # 库与账号需预先在 RDS 中创建；账号需具备建表权限，Flyway 迁移由应用启动时执行。
  database: "skillhub"
  username: "skillhub"
  # 密码不写这里：由 Secret 键 spring-datasource-password 提供。
  password: ""
  # 官方推荐形式（校验证书链，CA 从实例 SSL 页下载）：
  #   jdbc:postgresql://<host>:5432/<db>?sslmode=verify-ca&sslrootcert=/path/ca.pem
  # 但本 chart 未开放 server 的 volume 挂载，ca.pem 无法注入容器，因此默认用
  # sslmode=require：链路加密但**不校验服务端证书**，存在中间人风险（已知风险项）。
  # 要做到 verify-ca/verify-full，需上游给 server 增加证书挂载能力（或把 CA 打进镜像）。
  # 实例未开启 SSL 时改为 sslmode=prefer（同样不校验）。
  jdbcUrl: "jdbc:postgresql://skillhub-pg.REPLACE-ME.rds.myhuaweicloud.com:5432/skillhub?sslmode=require"
  # RDS 侧 max_connections 建议 >= 应用连接池上限 × server 最大副本数（本文件 6）。

# --- 缓存：托管 DCS for Redis -------------------------------------------------
redis:
  enabled: false

externalRedis:
  # 优先选 DCS 的 **Proxy 集群版/主备版**：客户端只需一个 host:port，
  # spring.data.redis.host/port 直接可用，无需特殊配置。
  # 实例连接地址见 DCS 控制台（主备版为一个 VIP 域名/IP）。REPLACE-ME = <REGION>。
  host: "skillhub-redis.REPLACE-ME.dcs.myhuaweicloud.com"
  port: 6379
  # DCS 默认仅密码认证、无 ACL 用户名，保持为空；
  # 若实例开启了 ACL/账号管理，填账号名（会注入 SPRING_DATA_REDIS_USERNAME）。
  username: ""
  # 密码不写这里：由 Secret 键 redis-password 提供。
  password: ""
  # DCS 未开启 TLS/SSL 时保持 false；实例开启 SSL 后改 true。
  tls:
    enabled: false
  connectTimeout: "5s"
  timeout: "3s"
  clientName: "skillmall-server"
  # sentinel / cluster 关闭时也必须是完整对象（schema required）。
  sentinel:
    enabled: false
    masterSet: mymaster
    nodes: []
    username: ""
    password: ""
  cluster:
    enabled: false
    nodes: []
    maxRedirects: 5
  # DCS 集群版（Cluster）：不能用上面的 host/port 单点，必须走节点列表，改
  #   cluster.enabled: true
  #   cluster.nodes: ["redis-0.REPLACE-ME.dcs.myhuaweicloud.com:6379", ...]
  # 且集群版只支持 db 0；sentinel 与 cluster 互斥。

# --- Server ------------------------------------------------------------------
server:
  enabled: true
  replicaCount: 2
  # 全新安装可直接开启；从旧版本滚动升级时先保持 false，全部 Pod 升级后再改 true。
  suiteReviewWritesEnabled: true

  # 依赖等待使用 SWR 内的 busybox（CCE 节点通常无法直连 docker.io）。
  dependencyWait:
    image:
      registry: "swr.<REGION>.myhuaweicloud.com/<ORG>"
      repository: "busybox"
      tag: "1.37"
      pullPolicy: IfNotPresent

  service:
    enabled: true
    type: ClusterIP
    port: 8080
    nodePort: ""
    loadBalancerIP: ""
    loadBalancerSourceRanges: []

  # OBS 模式下不使用 PVC；保留该块仅为满足 schema，并给出未来回退本地存储的取值。
  storage:
    accessMode: ""
    size: 10Gi
    storageClassName: "csi-disk"

  # 本地 PVC 才会用到；OBS 模式下无挂载，保留默认值无害。
  podSecurityContext:
    fsGroup: 101
    fsGroupChangePolicy: OnRootMismatch

  resources:
    requests:
      cpu: "1000m"
      memory: "2Gi"
    limits:
      cpu: "2000m"
      memory: "4Gi"

  # 容器内存按 limit 比例分配，避免 CCE 上因 Xmx 写死而 OOM。
  javaOpts: "-XX:MaxRAMPercentage=70.0 -XX:InitialRAMPercentage=40.0 -XX:+ExitOnOutOfMemoryError"

  imagePullSecrets:
    - name: default-secret
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

  probes:
    startup:
      httpGet:
        path: /actuator/health
        port: http
      initialDelaySeconds: 10
      periodSeconds: 10
      failureThreshold: 30
    readiness:
      httpGet:
        path: /actuator/health
        port: http
      initialDelaySeconds: 20
      periodSeconds: 10
    liveness:
      httpGet:
        path: /actuator/health
        port: http
      initialDelaySeconds: 30
      periodSeconds: 15

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

# --- Web（Nginx）--------------------------------------------------------------
web:
  replicaCount: 2
  # CCE 集群 DNS 域同样是 cluster.local，无需修改。
  clusterDomain: cluster.local
  basePath: ""
  apiBaseUrl: ""

  service:
    enabled: true
    type: ClusterIP
    port: 80
    nodePort: ""
    loadBalancerIP: ""
    loadBalancerSourceRanges: []

  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

  imagePullSecrets:
    - name: default-secret
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

# --- Scanner -----------------------------------------------------------------
scanner:
  enabled: true
  replicaCount: 2
  # schema 下限即为 110100480（约 105MiB），与 ingress 的 proxy-body-size 保持一致。
  maxUploadSizeBytes: 110100480

  service:
    port: 8000

  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2000m"
      memory: "4Gi"

  imagePullSecrets:
    - name: default-secret
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

# --- 可选：公开 GitHub 采集服务 -----------------------------------------------
# 默认不部署，本路径下**必须**保持关闭：
# 其暂存上传只实现了 local / s3 两种 provider
# （GithubSyncUploadAppService 中 `!"local".equals(provider) && !"s3".equals(provider)`
#   → IllegalStateException "Unsupported GitHub sync staging storage provider"），
# 而本路径 storage provider = obs，启用后会在生成上传票据时失败。
# 需要该服务时，请用 s3 provider 的部署形态（RustFS/Silo/MinIO）另建一套 values：
#   githubSync:
#     enabled: true
#     stagingCapacityLimitBytes: 1073741824
#     allowedS3Hosts: "<S3_STAGING_HOST>:<PORT>"
#   （服务密钥 github-sync-service-token 写进 skillhub-app-secrets）
githubSync:
  enabled: false

# --- 镜像拉取 ----------------------------------------------------------------
# CCE 会在每个命名空间自动创建并轮换 `default-secret`（SWR 长期凭证），
# 各组件 imagePullSecrets 直接引用它即可。**不要**自建/复制/覆盖该 Secret，
# 否则轮换后拉取会 401。跨账号或公开组织拉取时，才另建 docker-registry Secret
# 并替换上面三处 name。
global: {}
