# =============================================================================
# 示例/合并片段，需替换占位值；禁止提交真实凭证
# =============================================================================
# SkillHub on CCE —— 应用 Secret（values-cce.yaml 通过 existingSecret 引用它）
#
#   1) kubectl create namespace skillhub            # 命名空间按需改名
#   2) 复制本文件为不受版本控制的独立文件（例如 skillhub-app-secrets.yaml），
#      填入真实值后用 kubectl apply -f 创建；或用 External Secrets / Sealed
#      Secrets / KMS 注入，禁止把填好的文件提交到仓库。
#   3) helm -n skillhub upgrade -i skillhub ./charts/skillhub -f deploy/cce/values-cce.yaml
#
# 为什么必须预创建：values-cce.yaml 设置了 existingSecret，此时 chart **不再**
# 渲染应用 Secret，而 Server 的 secretKeyRef 中有两个键是**非 optional** 的：
#   - skillhub-download-anon-cookie-secret（匿名下载限流 Cookie 签名密钥）
#   - spring-datasource-password（externalDatabase 路径下的库密码；内置 Bitnami
#     库路径改从 Bitnami 自己的 Secret 读取，本键不再被引用）
# 缺键 → Pod 起不来（CreateContainerConfigError），不是启动后报错。
#
# 生成建议（32 字节以上随机值）：
#   openssl rand -base64 48
# -----------------------------------------------------------------------------

apiVersion: v1
kind: Secret
metadata:
  name: skillhub-app-secrets
  # 占位：与 helm 的 --namespace 保持一致，CCE 上通常就是 skillhub。
  namespace: skillhub
  labels:
    app.kubernetes.io/part-of: skillhub
type: Opaque

# 用 stringData 是为了让占位值可读；apply 时会自动转成 base64。
stringData:
  # ===========================================================================
  # 必填（Server 的 secretKeyRef 非 optional）
  # ===========================================================================
  # 数据库密码：postgresql.enabled=false（托管 RDS）时必填。
  # 使用 values-cce-incluster-db.yaml 叠加时由 Bitnami Secret 提供，此处可留空字符串。
  spring-datasource-password: "<RDS_PASSWORD>"

  # 匿名下载限流 Cookie 的签名密钥：必填，>=32 字符的随机串。
  # 轮换会使已签发的匿名下载票据失效，属预期行为。
  # 这里故意给应用内置的“未替换哨兵值”（AnonymousDownloadIdentityService 的
  # DISALLOWED_SECRET_VALUES 含 "replace-me"）：忘替换时会以
  # "must not use the default placeholder" 启动失败，而不是静默用弱密钥上线。
  skillhub-download-anon-cookie-secret: "replace-me"

  # 初始管理员密码：键本身 optional，但 bootstrapAdmin.enabled=true 且
  # 这里有值才会创建管理员；留空则首次启动不会写入管理员（且库为空时无人可登录）。
  bootstrap-admin-password: "<BOOTSTRAP_ADMIN_PASSWORD>"

  # ===========================================================================
  # 存储：OBS（本路径 provider=obs）
  # ===========================================================================
  # credentialMode=static 才需要；CCE 委托/元数据临时凭证模式（auto/metadata）
  # 下请留空，由运行时的临时凭证 + x-obs-security-token 承担。
  skillhub-storage-obs-access-key: ""
  skillhub-storage-obs-secret-key: ""

  # ===========================================================================
  # 缓存：DCS（本路径 redis.enabled=false 时需要）
  # ===========================================================================
  # DCS 密码：键 optional，但 DCS 默认开启密码认证，实际必须提供，否则连不上。
  redis-password: "<DCS_PASSWORD>"
  # 仅外部 Sentinel 且 Sentinel 使用独立密码时需要；DCS 主备版不需要。
  # redis-sentinel-password: ""

  # ===========================================================================
  # 可选：S3 兼容存储（本路径 s3.enabled=false，不启用；保留给 RustFS/Silo/AWS 分支）
  # ===========================================================================
  skillhub-storage-s3-access-key: ""
  skillhub-storage-s3-secret-key: ""

  # ===========================================================================
  # 可选：SSO / OAuth2 客户端
  # ===========================================================================
  oauth2-github-client-id: ""
  oauth2-github-client-secret: ""
  oauth2-feishu-client-id: ""
  oauth2-feishu-client-secret: ""
  oauth2-dingtalk-client-id: ""
  oauth2-dingtalk-client-secret: ""

  # ===========================================================================
  # 可选：Scanner 的安全扫描 LLM
  # ===========================================================================
  skill-scanner-llm-api-key: ""
  skill-scanner-llm-base-url: ""
  skill-scanner-llm-model: ""

  # ===========================================================================
  # 可选：首次初始化时的外部账号授权规则（默认不设）
  # ===========================================================================
  # 注意：**不能给空字符串**。应用侧是 objectMapper.readValue(roleGrantsJson)
  # （InitialAuthSettingsInitializer），空串会抛
  # IllegalStateException("Invalid initial external role grants JSON") 直接启动失败；
  # 而“键不存在”时才会用到 application.yml 里的默认值 []。
  # 需要预置时取消注释，给合法 JSON 数组，形如：
  #   [{"provider":"feishu","email":"a@example.com","role":"ADMIN"}]
  # 仅在数据库为空时生效一次；之后在后台“系统配置”里维护。
  # auth-initial-role-grants-json: "[]"

  # ===========================================================================
  # 可选：公开 GitHub 采集服务
  # ===========================================================================
  # 下面两个键被 server-deployment 以 optional:true 引用，缺失时环境变量不注入；
  # 这里显式给空值，语义等价（应用侧空密钥环 configured()=false，不会启动失败）。
  # 一旦要启用 githubSync，两者必须同时给出且成对一致：
  #   github-sync-credential-keys: "v1=<32 字节随机密钥的 Base64>"（逗号分隔保留旧版本）
  #   github-sync-active-credential-key-version: "v1"
  github-sync-credential-keys: ""
  github-sync-active-credential-key-version: ""
  # 仅 githubSync.enabled=true 时被引用（此时为**非 optional**）：≥32 字符随机串，
  # Java 与 Go 共用同一值。
  # github-sync-service-token: "<AT_LEAST_32_CHARS_RANDOM>"
