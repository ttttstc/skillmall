# =============================================================================
# 示例/合并片段，需替换占位值；禁止提交真实凭证
# =============================================================================
# 可选：把数据层从托管 RDS/DCS 换成 chart 内置的 Bitnami PostgreSQL / Redis。
#
# 这是**覆盖片段**，不是完整安装配置：必须叠加在 deploy/cce/values-cce.yaml 之上。
#
#   helm -n skillhub upgrade -i skillhub ./charts/skillhub \
#     -f deploy/cce/values-cce.yaml \
#     -f deploy/cce/values-cce-incluster-db.yaml
#
# 前提：
# 1. 已把 bitnami/postgresql 与 bitnami/redis 同步到 SWR（镜像清单见
#    deploy/cce/runtime-mirror-images.cce.txt，用 deploy/cce/mirror-images.sh 同步）。
#    本文件按映射表里的**目标 tag** 引用，并把 digest 留空；同步后可
#    `regctl manifest head <目标镜像>` 读出真实 digest 再回填（见 README 第 2 步）。
# 2. 已 `helm dependency build ./charts/skillhub`（仓库未 vendor 子 chart）。
# 3. 叠加后 server 的库/缓存密码改为引用 Bitnami 自己创建的 Secret，
#    Secret `skillhub-app-secrets` 里的 spring-datasource-password / redis-password
#    在本路径下不再被引用（保留无害）。
#
# 注意：上游 chart 明确声明不负责架构切换的数据迁移。已有 RDS/DCS 数据的实例
# 不能靠改本文件“迁移”进来，必须走备份/恢复。
# -----------------------------------------------------------------------------
# 占位符：<REGION>、<ORG> 见 values-cce.yaml 顶部说明；
#        <SKILLHUB_DB_PASSWORD> / <POSTGRESQL_ADMIN_PASSWORD> / <REDIS_PASSWORD>
#        为内置库的固定密码占位（GitOps 下必须显式给值，否则每次渲染都会变）。
# -----------------------------------------------------------------------------

# 镜像拉取用 CCE 自动创建并轮换的 default-secret（不要自建/复制）。
# Bitnami 子 chart 在非 docker.io 仓库/自定义镜像名时会做来源校验，
# 必须显式允许（这不代表允许不安全 HTTP 仓库）。
global:
  imagePullSecrets:
    - name: default-secret
  security:
    allowInsecureImages: true

# --- 内置 PostgreSQL（Bitnami 18.6.10）---------------------------------------
postgresql:
  enabled: true
  architecture: standalone

  # 镜像走 SWR。**不要把 chart 默认的 docker.io digest 直接搬过来**：
  # deploy/cce/mirror-images.sh 走的是 scripts/mirror-runtime-images.sh，对多平台
  # index 会用 regctl index create 重建，重建后的 index 与被丢弃的 attestation
  # 子清单会改变 digest。因此这里用「镜像映射表里的目标 tag」+ 清空 digest：
  # 同步完成后可用 `regctl manifest head <目标镜像>` 读出真实 digest 再回填
  # digest 字段（保持安装/回滚可复现）；不填 digest 时按 tag 解析。
  image:
    registry: "swr.<REGION>.myhuaweicloud.com/<ORG>"
    repository: "bitnami/postgresql"
    tag: "db2312d9b243"
    digest: ""

  auth:
    database: skillhub
    username: skillhub
    # 必须是固定值：allowAutoGenerated=false 语义下不允许每次渲染随机。
    password: "<SKILLHUB_DB_PASSWORD>"
    postgresPassword: "<POSTGRESQL_ADMIN_PASSWORD>"

  primary:
    persistence:
      enabled: true
      size: 20Gi
      # CCE 的 EVS 云硬盘 StorageClass：csi-disk（块存储，RWO）。
      # 需要 RWX 文件存储时用 csi-sfs（SFS 文件存储），不要用未文档化的 csi-disk-sas。
      storageClass: "csi-disk"
      accessModes:
        - ReadWriteOnce
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "2000m"
        memory: "4Gi"
    extraEnvVars:
      - name: POSTGRESQL_MAX_CONNECTIONS
        value: "500"

  # standalone 下不使用；预置好，避免将来改 replication 时漏配 StorageClass。
  readReplicas:
    persistence:
      enabled: true
      size: 20Gi
      storageClass: "csi-disk"

  # 指标 exporter 需另镜像 bitnami/postgres-exporter；未镜像前保持关闭。
  metrics:
    enabled: false
    serviceMonitor:
      enabled: false

# --- 内置 Redis（Bitnami 25.5.3）---------------------------------------------
redis:
  enabled: true
  architecture: standalone

  image:
    registry: "swr.<REGION>.myhuaweicloud.com/<ORG>"
    repository: "bitnami/redis"
    tag: "08863c2c3f4e"
    # 同上：镜像同步会重建多平台 index，digest 会变；按需回填真实 digest。
    digest: ""

  auth:
    enabled: true
    password: "<REDIS_PASSWORD>"

  master:
    persistence:
      enabled: true
      size: 10Gi
      storageClass: "csi-disk"
      accessModes:
        - ReadWriteOnce
    resources:
      requests:
        cpu: "200m"
        memory: "512Mi"
      limits:
        cpu: "1000m"
        memory: "2Gi"

  replica:
    persistence:
      enabled: true
      size: 10Gi
      storageClass: "csi-disk"

  # 哨兵需额外镜像 bitnami/redis-sentinel；如需 HA 再单独开启并镜像。
  sentinel:
    enabled: false

  # 指标 exporter 需另镜像 bitnami/redis-exporter；未镜像前保持关闭。
  metrics:
    enabled: false
    serviceMonitor:
      enabled: false

# 说明：内置库时无需 externalDatabase / externalRedis 的密码，但键仍保留
# （values-cce.yaml 中的占位值不会被使用，schema 也要求这些字段存在）。
externalDatabase:
  password: ""
externalRedis:
  password: ""
